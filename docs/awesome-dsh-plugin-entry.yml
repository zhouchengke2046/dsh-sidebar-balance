# awesome-dsh-plugin 收录条目(代提交用)
#
# 规范来源:github.com/awesome-dsh-plugin/awesome-dsh-plugin/contributing.md
# 提交前需满足(CI 自动检查):
#   1. 仓库创建满 1 天
#   2. 仓库提交数 >= 10
#   3. 声明 dsh.bundle(已满足)
#   4. 仓库已打 dsh-plugin topic(已满足)
